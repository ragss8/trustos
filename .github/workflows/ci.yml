# Gate order is fixed by architecture.md §15. Do not reorder to make a build pass:
# a later stage assumes the earlier ones held.
name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26'

jobs:
  static:
    name: format, lint, typecheck, boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      # Boundaries runs AFTER typecheck: workspace imports resolve through dist/,
      # so the graph is incomplete until the build has produced it.
      - run: pnpm typecheck
      - run: pnpm boundaries

  unit:
    name: unit and property tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  database:
    name: migrations and tenant isolation
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: trustos_root
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trustos_test
        options: >-
          --health-cmd "pg_isready -U trustos_root" --health-interval 5s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm db:migrate
        env:
          DATABASE_ROOT_URL: postgresql://trustos_root:postgres@localhost:5432/trustos_test
          DATABASE_MIGRATION_URL: postgresql://trustos_migrator:local_dev_only@localhost:5432/trustos_test
      # Runs as trustos_app: a non-owner role without BYPASSRLS. Running these as the
      # owner would pass while proving nothing.
      - run: pnpm --filter @trustos/database test
        env:
          DATABASE_URL: postgresql://trustos_app:local_dev_only@localhost:5432/trustos_test

  auth:
    name: token validation against a real provider
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # A stub issuer would not exercise JWKS lookup, kid rotation or the provider's
      # actual claim shape -- which is exactly where the last bug was.
      - run: docker compose up -d keycloak
      - name: wait for keycloak
        run: |
          for i in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' trustos-keycloak-1)" = "healthy" ]; then
              echo ready; exit 0
            fi
            sleep 3
          done
          docker compose logs keycloak; exit 1
      - run: pnpm --filter @trustos/auth test
